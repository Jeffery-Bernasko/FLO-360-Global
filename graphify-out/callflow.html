<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLO 360 — Call Flow Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0f1a; color: #e0e6ed; overflow: hidden; }
  #container { width: 100vw; height: 100vh; position: relative; }

  /* Controls panel */
  #controls {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(100, 200, 150, 0.2);
    border-radius: 12px; padding: 16px; width: 280px;
    backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #controls h1 { font-size: 15px; font-weight: 600; color: #6ee7b7; margin-bottom: 4px; }
  #controls .subtitle { font-size: 11px; color: #64748b; margin-bottom: 12px; }
  #controls label { font-size: 11px; color: #94a3b8; display: block; margin-top: 8px; }
  #controls input[type="text"] {
    width: 100%; padding: 6px 10px; background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(100, 200, 150, 0.15); border-radius: 6px;
    color: #e0e6ed; font-size: 12px; margin-top: 4px; outline: none;
  }
  #controls input[type="text"]:focus { border-color: rgba(110, 231, 183, 0.5); }
  #controls .stats { font-size: 11px; color: #64748b; margin-top: 12px; line-height: 1.6; }
  #controls .stats span { color: #6ee7b7; font-weight: 600; }

  /* Filter buttons */
  .filter-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .filter-btn {
    font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(100, 200, 150, 0.2); background: rgba(30, 41, 59, 0.6);
    color: #94a3b8; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: rgba(110, 231, 183, 0.4); color: #e0e6ed; }
  .filter-btn.active { background: rgba(110, 231, 183, 0.15); border-color: #6ee7b7; color: #6ee7b7; }

  /* Info panel */
  #info {
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(100, 200, 150, 0.2);
    border-radius: 12px; padding: 16px; max-width: 360px; max-height: 50vh;
    overflow-y: auto; backdrop-filter: blur(12px); display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #info h2 { font-size: 14px; color: #6ee7b7; margin-bottom: 8px; word-break: break-all; }
  #info .meta { font-size: 11px; color: #64748b; margin-bottom: 8px; }
  #info .meta b { color: #94a3b8; }
  #info .edge-list { font-size: 11px; line-height: 1.7; }
  #info .edge-list .edge-item { padding: 2px 0; border-bottom: 1px solid rgba(100, 200, 150, 0.06); }
  #info .edge-item .rel { color: #fbbf24; font-weight: 500; }
  #info .edge-item .target { color: #93c5fd; }
  #info .edge-item .conf { font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: 4px; }
  .conf-extracted { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
  .conf-inferred { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

  /* Legend */
  #legend {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(100, 200, 150, 0.2);
    border-radius: 12px; padding: 12px 16px;
    backdrop-filter: blur(12px); font-size: 11px;
  }
  #legend h3 { font-size: 12px; color: #6ee7b7; margin-bottom: 6px; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: #94a3b8; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-line { width: 20px; height: 2px; }
</style>
</head>
<body>
<div id="container"></div>

<div id="controls">
  <h1>FLO 360 Call Flow</h1>
  <div class="subtitle">Directed call graph &middot; arrows show caller → callee</div>
  <label>Search nodes</label>
  <input type="text" id="search" placeholder="e.g. requireManager, stock..." />
  <label>Show relations</label>
  <div class="filter-row">
    <button class="filter-btn active" data-rel="calls">calls</button>
    <button class="filter-btn active" data-rel="references">references</button>
    <button class="filter-btn active" data-rel="shares_data_with">shares data</button>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div id="legend">
  <h3>Edge types</h3>
  <div class="legend-item"><div class="legend-line" style="background:#6ee7b7"></div> calls</div>
  <div class="legend-item"><div class="legend-line" style="background:#93c5fd"></div> references</div>
  <div class="legend-item"><div class="legend-line" style="background:#fbbf24"></div> shares_data_with</div>
  <h3 style="margin-top:8px">Confidence</h3>
  <div class="legend-item"><div class="legend-line" style="background:#4ade80; height:3px"></div> EXTRACTED</div>
  <div class="legend-item"><div class="legend-line" style="background:#fbbf24; height:2px; border-style:dashed"></div> INFERRED</div>
</div>

<div id="info"></div>

}, true);
</script>

// Community color palette (20 distinct colors)
const PALETTE = [
  '#6ee7b7','#93c5fd','#fbbf24','#f87171','#a78bfa',
  '#fb923c','#2dd4bf','#f472b6','#818cf8','#34d399',
  '#facc15','#60a5fa','#c084fc','#fb7185','#4ade80',
  '#38bdf8','#e879f9','#a3e635','#22d3ee','#f97316'
];

const EDGE_COLORS = {
  calls: '#6ee7b7',
  references: '#93c5fd',
  shares_data_with: '#fbbf24',
};

(function init() {
  const Graph = graphology.Graph;
  const graph = new Graph({ multi: true, type: 'directed', allowSelfLoops: false });

  // Add nodes with initial random positions
  const nodeMap = new Map();
  GRAPH_DATA.nodes.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / GRAPH_DATA.nodes.length;
    const radius = 80 + Math.random() * 40;
    const color = PALETTE[n.community % PALETTE.length];
    const size = Math.min(3 + Math.sqrt(n.degree) * 1.5, 18);
    graph.addNode(n.id, {
      label: n.label,
      x: radius * Math.cos(angle) + (Math.random() - 0.5) * 20,
      y: radius * Math.sin(angle) + (Math.random() - 0.5) * 20,
      size: size,
      color: color,
      community: n.community,
      source_file: n.source_file,
      file_type: n.file_type,
      originalColor: color,
      originalSize: size,
    });
    nodeMap.set(n.id, n);
  });

  // Add edges
  GRAPH_DATA.edges.forEach((e, i) => {
    if (graph.hasNode(e.source) && graph.hasNode(e.target)) {
      graph.addEdge(e.source, e.target, {
        relation: e.relation,
        confidence: e.confidence,
        confidence_score: e.confidence_score,
        color: EDGE_COLORS[e.relation] || '#475569',
        size: e.confidence === 'EXTRACTED' ? 1.5 : 0.8,
        type: 'arrow',
      });
    }
  });

  // Run ForceAtlas2 layout
  const fa2Settings = {
    iterations: 300,
    settings: {
      gravity: 0.5,
      scalingRatio: 8,
      barnesHutOptimize: true,
      barnesHutTheta: 0.6,
      strongGravityMode: true,
      slowDown: 3,
    }
  };

  ForceAtlas2.assign(graph, fa2Settings);

  // Render with Sigma
  const container = document.getElementById('container');
  const renderer = new Sigma(graph, container, {
    renderEdgeLabels: false,
    defaultEdgeType: 'arrow',
    edgeReducer: (edge, data) => {
      const res = { ...data };
      if (state.hiddenRelations.has(data.relation)) {
        res.hidden = true;
      }
      if (state.hoveredNode) {
        if (!graph.hasExtremity(edge, state.hoveredNode) &&
            !graph.hasExtremity(edge, state.selectedNode)) {
          res.hidden = true;
        }
      }
      if (state.searchActive && !state.matchedNodes.has(graph.source(edge)) && !state.matchedNodes.has(graph.target(edge))) {
        res.hidden = true;
      }
      return res;
    },
    nodeReducer: (node, data) => {
      const res = { ...data };
      if (state.hoveredNode) {
        if (node !== state.hoveredNode && !state.hoveredNeighbors.has(node)) {
          res.color = '#1e293b';
          res.size = data.originalSize * 0.5;
          res.label = '';
        } else {
          res.highlighted = true;
        }
      }
      if (state.searchActive) {
        if (state.matchedNodes.has(node)) {
          res.highlighted = true;
          res.color = '#f87171';
          res.size = data.originalSize * 1.5;
        } else {
          res.color = '#1e293b';
          res.size = data.originalSize * 0.4;
          res.label = '';
        }
      }
      return res;
    },
    labelColor: { color: '#cbd5e1' },
    labelSize: 11,
    labelWeight: '500',
    labelRenderedSizeThreshold: 8,
    defaultNodeColor: '#475569',
    defaultEdgeColor: '#334155',
    minCameraRatio: 0.05,
    maxCameraRatio: 10,
  });

  // State
  const state = {
    hoveredNode: null,
    hoveredNeighbors: new Set(),
    selectedNode: null,
    hiddenRelations: new Set(),
    searchActive: false,
    matchedNodes: new Set(),
  };

  // Stats
  document.getElementById('stats').innerHTML =
    `<span>${GRAPH_DATA.nodes.length}</span> nodes &middot; <span>${GRAPH_DATA.edges.length}</span> edges<br>` +
    `<span>${GRAPH_DATA.edges.filter(e => e.relation === 'calls').length}</span> calls &middot; ` +
    `<span>${GRAPH_DATA.edges.filter(e => e.relation === 'references').length}</span> references &middot; ` +
    `<span>${GRAPH_DATA.edges.filter(e => e.relation === 'shares_data_with').length}</span> shares_data`;

  // Hover
  renderer.on('enterNode', ({ node }) => {
    state.hoveredNode = node;
    state.hoveredNeighbors = new Set(graph.neighbors(node));
    renderer.refresh();
  });
  renderer.on('leaveNode', () => {
    state.hoveredNode = null;
    state.hoveredNeighbors = new Set();
    renderer.refresh();
  });

  // Click: show info panel
  renderer.on('clickNode', ({ node }) => {
    state.selectedNode = node;
    const attrs = graph.getNodeAttributes(node);
    const info = document.getElementById('info');

    // Gather edges
    let edgesHtml = '';
    graph.forEachOutEdge(node, (edge, eAttrs, source, target) => {
      const tLabel = graph.getNodeAttribute(target, 'label');
      const confClass = eAttrs.confidence === 'EXTRACTED' ? 'conf-extracted' : 'conf-inferred';
      edgesHtml += `<div class="edge-item">→ <span class="rel">${eAttrs.relation}</span> → <span class="target">${tLabel}</span> <span class="conf ${confClass}">${eAttrs.confidence}</span></div>`;
    });
    graph.forEachInEdge(node, (edge, eAttrs, source, target) => {
      const sLabel = graph.getNodeAttribute(source, 'label');
      const confClass = eAttrs.confidence === 'EXTRACTED' ? 'conf-extracted' : 'conf-inferred';
      edgesHtml += `<div class="edge-item">← <span class="rel">${eAttrs.relation}</span> ← <span class="target">${sLabel}</span> <span class="conf ${confClass}">${eAttrs.confidence}</span></div>`;
    });

    info.innerHTML = `
      <h2>${attrs.label}</h2>
      <div class="meta">
        <b>File:</b> ${attrs.source_file || '—'}<br>
        <b>Type:</b> ${attrs.file_type || '—'} &middot; <b>Community:</b> ${attrs.community}<br>
        <b>Degree:</b> ${graph.degree(node)} (in: ${graph.inDegree(node)}, out: ${graph.outDegree(node)})
      </div>
      <div class="edge-list">${edgesHtml || '<em style="color:#475569">No call-flow edges</em>'}</div>
    `;
    info.style.display = 'block';
  });

  renderer.on('clickStage', () => {
    state.selectedNode = null;
    document.getElementById('info').style.display = 'none';
  });

  // Search
  document.getElementById('search').addEventListener('input', function(e) {
    const q = e.target.value.toLowerCase().trim();
    state.searchActive = q.length > 0;
    state.matchedNodes.clear();
    if (q) {
      graph.forEachNode((node, attrs) => {
        if (attrs.label.toLowerCase().includes(q) || (attrs.source_file || '').toLowerCase().includes(q)) {
          state.matchedNodes.add(node);
          // Also add immediate neighbors for context
          graph.forEachNeighbor(node, (neighbor) => state.matchedNodes.add(neighbor));
        }
      });
    }
    renderer.refresh();
  });

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const rel = this.dataset.rel;
      this.classList.toggle('active');
      if (this.classList.contains('active')) {
        state.hiddenRelations.delete(rel);
      } else {
        state.hiddenRelations.add(rel);
      }
      renderer.refresh();
    });
  });
})();
</script>
